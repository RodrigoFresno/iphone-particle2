<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Particles">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>iPhone Particles</title>
<style>
:root{color-scheme:dark;--bg:#080b13;--panel:#121827;--line:#283247;--muted:#9aa8c0;--accent:#74aaff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;padding:12px 14px 14px;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0}
h1{font-size:18px;letter-spacing:.12em;margin:0;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:3px}
.live{font-size:10px;color:#62e6ad;border:1px solid #245b49;border-radius:30px;padding:7px 10px;white-space:nowrap}
.stage{position:relative;flex:1;min-height:170px;border:1px solid #263148;border-radius:19px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#101a30,#060910 75%);touch-action:none}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:13px;left:14px;color:#91a0ba;font:10px ui-monospace,monospace;line-height:1.6;pointer-events:none}
.counter{position:absolute;bottom:12px;right:14px;color:#91a0ba;font:10px ui-monospace,monospace;pointer-events:none}
.hint{text-align:center;color:var(--muted);font-size:11px;flex-shrink:0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex-shrink:0}
button{appearance:none;border:1px solid var(--line);border-radius:12px;background:#151d2d;color:#f3f6ff;padding:12px;font-size:13px;font-weight:650}
button:active{transform:scale(.98);background:#202d46}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:11px 13px;display:grid;grid-template-columns:1fr 1fr;gap:12px;flex-shrink:0}
.field{min-width:0}.field.full{grid-column:1/-1}
.fieldtop{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#dce5f7;margin-bottom:7px}
input[type=range]{width:100%;accent-color:#8caeff;margin:0}
input[type=color]{width:35px;height:28px;border:0;background:transparent;padding:0}
footer{text-align:center;color:#687791;font-size:9px;flex-shrink:0}
@media(min-height:850px){.app{padding-top:18px;gap:15px}.panel{padding:15px}.stage{min-height:250px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>IPHONE PARTICLES</h1><div class="sub">INTERACTIVE PARTICLE LAB</div></div><div class="live">● ENGINE LIVE</div></header>
<main class="stage" id="stage">
<canvas id="canvas"></canvas>
<div class="hud">TOQUE • ARRASTE • CRIE<br>PARTICLE SYSTEM / 01</div>
<div class="counter" id="counter">0 PARTICLES</div>
</main>
<div class="hint">Toque ou deslize o dedo na área para criar partículas</div>
<div class="controls"><button id="clear">Limpar partículas</button><button id="pause">Pausar animação</button></div>
<section class="panel">
<div class="field"><div class="fieldtop"><label for="color">Cor</label><input id="color" type="color" value="#74aaff"></div></div>
<div class="field"><div class="fieldtop"><label for="density">Quantidade</label><span id="densityVal">25</span></div><input id="density" type="range" min="1" max="70" value="25"></div>
<div class="field"><div class="fieldtop"><label for="size">Tamanho</label><span id="sizeVal">5 px</span></div><input id="size" type="range" min="2" max="12" value="5"></div>
<div class="field"><div class="fieldtop"><label for="life">Duração</label><span id="lifeVal">100</span></div><input id="life" type="range" min="30" max="200" value="100"></div>
</section>
<footer>VERSÃO WEB INSTALÁVEL • FUNCIONA OFFLINE APÓS A PRIMEIRA ABERTURA</footer>
</div>
<script>
(()=>{
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
let w=0,h=0,particles=[],running=true,down=false,last=0,color='#74aaff',density=25,size=5,life=100,raf=0;
const counter=document.getElementById('counter');
function resize(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(stage);resize();
function emit(x,y,n){for(let i=0;i<n&&particles.length<3200;i++){const a=Math.random()*Math.PI*2,s=.25+Math.random()*3.2;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,age:0,max:life*(.65+Math.random()*.7),color,sz:size*(.6+Math.random()*.8),twinkle:Math.random()})}}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();down=true;canvas.setPointerCapture(e.pointerId);let p=pos(e);emit(p.x,p.y,density*2);last=performance.now()});
canvas.addEventListener('pointermove',e=>{if(!down)return;e.preventDefault();let p=pos(e),now=performance.now();if(now-last>12){emit(p.x,p.y,density);last=now}});
function stop(){down=false}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('lostpointercapture',stop);
function frame(){if(!running)return;ctx.clearRect(0,0,w,h);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.012;p.vx*=.995;p.age++;if(p.age>=p.max){particles.splice(i,1);continue}let alpha=Math.max(0,1-p.age/p.max);ctx.globalAlpha=alpha;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=5+p.sz;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(.65+.35*Math.sin(p.age*.13+p.twinkle*6)),0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;ctx.globalAlpha=1;counter.textContent=particles.length+' PARTICLES';raf=requestAnimationFrame(frame)}
function start(){if(!running)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}start();
document.getElementById('clear').onclick=()=>{particles=[];ctx.clearRect(0,0,w,h);counter.textContent='0 PARTICLES'};
document.getElementById('pause').onclick=e=>{running=!running;e.target.textContent=running?'Pausar animação':'Continuar animação';if(running)start();else cancelAnimationFrame(raf)};
document.getElementById('color').oninput=e=>color=e.target.value;
function slider(id,fn,format){let el=document.getElementById(id);el.oninput=()=>{fn(+el.value);document.getElementById(id+'Val').textContent=format(+el.value)}}
slider('density',v=>density=v,v=>v);slider('size',v=>size=v,v=>v+' px');slider('life',v=>life=v,v=>v);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf)}else if(running)start()});
})();
</script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body></html>
